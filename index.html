<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List App</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
        transition: background 0.3s, color 0.3s;
      }

      body {
        background: linear-gradient(135deg, #9f78ec, #081242);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        width: 90%;
        max-width: 400px;
        background: rgba(255, 255, 255, 0.95);
        padding: 30px 25px;
        border-radius: 20px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(10px);
      }

      .todo-app h2 {
        color: #333;
        font-weight: 600;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .theme-btn {
        background: transparent;
        border: none;
        font-size: 22px;
        cursor: pointer;
        transition: transform 0.3s ease;
      }

      .theme-btn:hover {
        transform: scale(1.2);
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      #input-box {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 10px;
        outline: none;
        font-size: 16px;
        background: #f0f0f0;
      }

      #add-btn {
        padding: 12px 18px;
        margin-left: 10px;
        border: none;
        background: #6c63ff;
        color: #fff;
        font-weight: 600;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
      }

      #add-btn:hover {
        background: #574b90;
        transform: scale(1.05);
      }

      ul {
        max-height: 300px;
        overflow-y: auto;
        padding-right: 5px;
      }

      ul li {
        list-style: none;
        font-size: 17px;
        padding: 12px 8px 12px 45px;
        user-select: none;
        cursor: pointer;
        position: relative;
        background: #f8f8f8;
        border-radius: 10px;
        margin-bottom: 10px;
        transition: 0.3s ease;
        animation: fadeIn 0.3s ease;
      }

      ul li:hover {
        background: #e9e9e9;
      }

      ul li::before {
        content: "";
        position: absolute;
        height: 22px;
        width: 22px;
        border-radius: 50%;
        background: url("data:image/svg+xml,%3Csvg fill='none' stroke='%23999' stroke-width='2' xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3C/svg%3E")
          no-repeat center;
        background-size: cover;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
      }

      ul li.checked {
        color: #777;
        text-decoration: line-through;
      }

      ul li.checked::before {
        background: url("data:image/svg+xml,%3Csvg fill='%236c63ff' xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Cpath d='M8 12.5l2.5 2.5 5-5' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E")
          no-repeat center;
        background-size: cover;
      }

      ul li span {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 22px;
        color: #555;
        cursor: pointer;
        transition: 0.3s;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        text-align: center;
        line-height: 30px;
      }

      ul li span:hover {
        background: #ddd;
        color: #222;
      }

      body.dark {
        background: linear-gradient(135deg, #1c1c1c, #323232);
      }

      body.dark .container {
        background: rgba(35, 35, 35, 0.9);
        color: #f1f1f1;
      }

      body.dark #input-box {
        background: #2a2a2a;
        color: #fff;
      }

      body.dark ul li {
        background: #2c2c2c;
        color: #ddd;
      }

      body.dark ul li span:hover {
        background: #3c3c3c;
        color: #fff;
      }

      body.dark #add-btn {
        background: #ff8c42;
      }

      body.dark #add-btn:hover {
        background: #e6762f;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 500px) {
        .container {
          padding: 20px;
        }
        #input-box {
          font-size: 15px;
        }
        #add-btn {
          padding: 10px 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="todo-app">
        <div class="header">
          <h2>To-Do List 📝</h2>
          <button id="theme-toggle" class="theme-btn">🌙</button>
        </div>

        <div class="row">
          <input
            type="text"
            id="input-box"
            placeholder="Add your task..."
            spellcheck="false"
          />
          <button id="add-btn">Add</button>
        </div>

        <ul id="list-container"></ul>
      </div>
    </div>

    <script>
      const inputBox = document.getElementById("input-box");
      const listContainer = document.getElementById("list-container");
      const addBtn = document.getElementById("add-btn");
      const themeToggle = document.getElementById("theme-toggle");

      addBtn.addEventListener("click", addTask);

      function addTask() {
        if (inputBox.value.trim() === "") {
          alert("Please enter a task!");
        } else {
          let li = document.createElement("li");
          li.innerHTML = inputBox.value;
          listContainer.appendChild(li);

          let span = document.createElement("span");
          span.innerHTML = "\u00d7";
          li.appendChild(span);

          saveData();
        }
        inputBox.value = "";
      }

      listContainer.addEventListener(
        "click",
        function (e) {
          if (e.target.tagName === "LI") {
            e.target.classList.toggle("checked");
            saveData();
          } else if (e.target.tagName === "SPAN") {
            e.target.parentElement.remove();
            saveData();
          }
        },
        false
      );

      function saveData() {
        localStorage.setItem("todoData", listContainer.innerHTML);
      }

      function showTasks() {
        listContainer.innerHTML = localStorage.getItem("todoData");
      }
      showTasks();

      inputBox.addEventListener("keyup", (e) => {
        if (e.key === "Enter") addTask();
      });

      themeToggle.addEventListener("click", () => {
        document.body.classList.toggle("dark");

        if (document.body.classList.contains("dark")) {
          themeToggle.textContent = "☀️";
          localStorage.setItem("theme", "dark");
        } else {
          themeToggle.textContent = "🌙";
          localStorage.setItem("theme", "light");
        }
      });

      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
        document.body.classList.add("dark");
        themeToggle.textContent = "☀️";
      }
    </script>
  </body>
</html>
